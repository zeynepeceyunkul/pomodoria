name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm start &
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/pomodoria_ci
          JWT_SECRET: ci-test-secret-minimum-32-characters-long
          JWT_REFRESH_SECRET: ci-test-refresh-secret-32-chars-min
      - run: sleep 5 && node scripts/smoke-api.js
        env:
          API_BASE: http://127.0.0.1:5000
          MONGO_URI: mongodb://127.0.0.1:27017/pomodoria_ci

  web:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend-web/package-lock.json
      - name: Install backend
        working-directory: backend
        run: npm ci
      - name: Install web
        working-directory: frontend-web
        run: npm ci
      - name: Build web
        working-directory: frontend-web
        run: npm run build
        env:
          VITE_API_URL: http://127.0.0.1:5000
      - name: Install Playwright
        working-directory: frontend-web
        run: npx playwright install --with-deps chromium
      - name: E2E tests
        working-directory: frontend-web
        run: npm run test:e2e
        env:
          CI: true
          MONGO_URI: mongodb://127.0.0.1:27017/pomodoria_ci
          JWT_SECRET: ci-test-secret-minimum-32-characters-long
          JWT_REFRESH_SECRET: ci-test-refresh-secret-32-chars-min
